{{define "student_select"}}
{{if .Students}}
<select name="student_id"
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        hx-get="/api/v1/classes"
        hx-target="#classes-container"
        hx-trigger="change"
        hx-swap="innerHTML"
        hx-indicator="#loading-classes"
        onchange="document.getElementById('booking-result').innerHTML = '';">
    <option value="">— Choose a child —</option>
    {{range .Students}}
    <option value="{{.ID}}">{{.Name}} (Age {{.Age}})</option>
    {{end}}
</select>
{{else}}
<p class="text-gray-400 text-sm">No children found for this parent.</p>
{{end}}
{{end}}
